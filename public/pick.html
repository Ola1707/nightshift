<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI board · Pick</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <h1>Pick tonight's tasks</h1>
      <p class="muted">Press a box to choose it. Open a box's “more” to read the whole task.</p>
      <div id="decisions"></div>
      <div id="reverts"></div>
      <div class="search">
        <input id="search" type="search" placeholder="Search tasks: code, title, text or note" />
        <span id="search-count" class="muted small"></span>
      </div>
      <div id="night"></div>
      <div class="section-head">
        <h2>Other roadmaps</h2>
        <span class="muted small">by phase, open tasks only · drag ⠿ to change the order</span>
        <button id="send-order" disabled>Order sent ✓</button>
      </div>
      <div id="other"></div>
    </main>
    <div class="bar">
      <span id="count">0 chosen</span>
      <span>
        <button class="link" id="check-night">Check all night work</button>
        <button class="link" id="clear">Uncheck all</button>
        <button id="save">Save and see the list →</button>
      </span>
    </div>
    <script type="module" src="/pick.js"></script>
  </body>
</html>
